<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>번호의 주인: 야구편 OG 이미지</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f2f4f6;
        color: #191f28;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1200px, 100%); margin: 0 auto; padding: 40px 20px 80px; }
      h1 { margin: 0 0 8px; font-size: 32px; }
      p { margin: 0 0 32px; color: #6b7684; }
      section { margin-top: 40px; }
      h2 { margin: 0 0 16px; font-size: 22px; text-transform: uppercase; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      a {
        overflow: hidden;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        color: inherit;
        text-decoration: none;
      }
      img { display: block; width: 100%; height: auto; }
      strong { display: block; padding: 12px 16px 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>번호의 주인: 야구편 OG 이미지</h1>
      <p>10개 연고지 × 5개 덕력 등급 · 1200 × 600 PNG · OG v3</p>
      <div id="assets"></div>
    </main>
    <script>
      const teams = [
        "daegu", "seoul-lg", "seoul-doosan", "suwon", "seoul-kiwoom",
        "gwangju", "daejeon", "changwon", "busan", "incheon"
      ];
      const tiers = ["starter", "bronze", "silver", "gold", "champion"];
      const root = document.querySelector("#assets");

      for (const team of teams) {
        const section = document.createElement("section");
        section.innerHTML = `<h2>${team}</h2><div class="grid"></div>`;
        const grid = section.querySelector(".grid");

        for (const tier of tiers) {
          const path = `og-results-v3/${team}/tier-${tier}.png`;
          const link = document.createElement("a");
          link.href = path;
          link.innerHTML = `<img src="${path}" alt="${team} ${tier} OG 이미지" loading="lazy" /><strong>${tier}</strong>`;
          grid.append(link);
        }

        root.append(section);
      }
    </script>
  </body>
</html>
